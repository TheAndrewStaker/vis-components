name: CI

# Verifies every push to main and every PR: types, lint, tests, and a
# production build. `build` itself re-runs `typecheck` (see package.json), but we run it
# as its own step first so a type failure is attributed clearly instead of
# surfacing inside the build step.
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref so a fast-follow push doesn't queue
# a stale verification.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test (with coverage floor)
        run: pnpm run test:coverage

      - name: Build
        run: pnpm run build

  # Playwright end-to-end suite. Separate job so the fast typecheck/unit
  # feedback above isn't gated behind browser install + the longer e2e run.
  # Playwright starts its own Vite server (see playwright.config.ts).
  #
  # Pinned to ubuntu-24.04 rather than ubuntu-latest: when GitHub rolled
  # `ubuntu-latest` to 26.04 (2026-10), `playwright install --with-deps`
  # refused with "Playwright does not support chromium on ubuntu26.04-x64"
  # for the pinned 1.60.0. Playwright >= 1.64 supports 26.04, so this pin can
  # be dropped when the Playwright pin is next bumped deliberately.
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e tests
        run: pnpm run test:e2e

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
